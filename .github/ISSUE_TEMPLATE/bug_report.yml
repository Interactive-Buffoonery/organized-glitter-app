name: Bug report
description: Report a reproducible problem in the iPhone or iPad app
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Don’t include credentials, customer data, private file URLs, or production configuration. Report security problems privately using SECURITY.md.
  - type: checkboxes
    id: existing
    attributes:
      label: Existing report
      options:
        - label: I searched the existing issues and didn’t find this problem.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the smallest safe example that reproduces the problem.
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: "iPhone 17 simulator, iOS 26.4"
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: "Xcode 26.4"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots only if they contain no private information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, customer content, email addresses, private file URLs, and production configuration.
          required: true
