name: OrganizedGlitter

options:
  bundleIdPrefix: com.interactivebuffoonery
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    version: 3.90.1

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

targets:
  OrganizedGlitter:
    type: application
    platform: iOS
    dependencies:
      - package: PostHog
    sources:
      - path: OrganizedGlitter
      - path: BackendContract.json
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: OrganizedGlitter/Preview/FixtureAssets.xcassets
        CODE_SIGN_ENTITLEMENTS: OrganizedGlitter/OrganizedGlitter.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: OrganizedGlitter/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.organizedglitter
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) FixtureAssets.xcassets"
    scheme:
      testTargets:
        - OrganizedGlitterTests
        - OrganizedGlitterUITests

  OrganizedGlitterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrganizedGlitterTests
    dependencies:
      - target: OrganizedGlitter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.organizedglitter.tests

  OrganizedGlitterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OrganizedGlitterUITests
    dependencies:
      - target: OrganizedGlitter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.organizedglitter.uitests
